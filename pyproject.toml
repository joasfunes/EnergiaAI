[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energia-ai"
version = "0.1.0"
description = "Consultor energético residencial para usuarios de EDEMSA en Mendoza"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]
